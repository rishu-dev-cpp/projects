<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="choice-box">
            <button class="button1" onclick="playGame(1)">✊</button>
            <button class="button2" onclick="playGame(2)">🖐️</button>
            <button class="button3" onclick="playGame(3)">✌️</button>
        </div>
        <p id="result"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
