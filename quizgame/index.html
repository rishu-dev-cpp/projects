<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrapper">
    <h1>Quiz Game !!!</h1>
    <div class="container">
        <h2 id="question">Question Text Here</h2>
    
        <div class="options-box">
            <button class="option-btn" onclick="checkAnswer(0)">Option 1</button>
            <button class="option-btn" onclick="checkAnswer(1)">Option 2</button>
            <button class="option-btn" onclick="checkAnswer(2)">Option 3</button>
            <button class="option-btn" onclick="checkAnswer(3)">Option 4</button>
        </div>
    
        <div id="score-card" style="display: none;">
            <h3>Your Final Score: <span id="final-score">0</span></h3>
            <button class="restart" onclick="restart()">Try Again</button>
            
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
